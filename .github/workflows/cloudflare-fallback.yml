name: Cloudflare fallback

on:
  pull_request:
    paths:
      - "src/**"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-fallback.yml"
  workflow_dispatch:
    inputs:
      deploy_fallback:
        description: "Deploy the fallback Worker to its workers.dev URL (does not change puntr.co.za)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Cloudflare Worker output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build using Nitro Cloudflare Workers preset
        run: bun run build
        env:
          NITRO_PRESET: cloudflare_module
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy fallback Worker
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_fallback == true
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-fallback
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Cloudflare Worker
        run: bun run build
        env:
          NITRO_PRESET: cloudflare_module
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy to Cloudflare Workers
        run: bunx wrangler@4.68.0 deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
