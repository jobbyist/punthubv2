name: PFIE, sports and odds tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/pfie/**"
      - "src/lib/odds/**"
      - "src/lib/sports/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pfie-odds-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test PFIE and odds pipelines
        run: npx vitest run src/lib/pfie/standings.test.ts src/lib/sports/sports.test.ts src/lib/odds/sync.test.ts
