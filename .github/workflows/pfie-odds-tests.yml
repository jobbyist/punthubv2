name: PFIE and odds tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/pfie/**"
      - "src/lib/odds/**"
      - "src/lib/content/**"
      - "src/lib/badges/**"
      - "src/lib/quota.server.ts"
      - "src/lib/sports/select.server.ts"
      - "src/lib/api-usage.functions.ts"
      - "src/components/admin/api-usage-admin.tsx"
      - "src/routes/admin.index.tsx"
      - "supabase/migrations/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pfie-odds-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test PFIE, odds and API attribution
        run: bunx vitest run src/lib/pfie/standings.test.ts src/lib/pfie/pfie.test.ts src/lib/odds/sync.test.ts
